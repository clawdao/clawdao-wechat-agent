# =============================================================================
# 公众号品牌档案（Brand Profile）
# =============================================================================
# 这个文件定义**个性化信息**——每个公众号用户都不同。
# 而 styles/*.yml 定义**风格样式**——可以被多个品牌复用。
# 分工：profile 是个性，styles 是美学，两者解耦。
#
# 第一次使用项目时，运行：
#   python3 tools/profile_setup.py
# 它会通过 8 个问题引导你填完这份档案，并把硬编码值替换为读取这里。
# =============================================================================

profile:
  # ── 基本信息 ────────────────────────────────────────────────
  account:
    name: "亿检链"                       # 公众号名（中文）
    name_en: "LIMSCHAIN"                 # 公众号名（英文）
    parent_brand: "利姆斯科技旗下品牌"     # 母品牌
    slogan: "让企业运营可被验证"          # 一句话定位
    domain: "科技 · 商业 · 认知"           # 内容领域
    audience: "科技从业者、创业者、认知升级人群、企业运营者"

  # ── 作者信息 ────────────────────────────────────────────────
  author:
    name: "顺道大叔"                       # 显示作者名
    signature: "愿你的下一篇文章，写得比今天更轻松一点"
    voice: "轻松专业，有深度但不晦涩"

  # ── 品牌资产 ────────────────────────────────────────────────
  brand_assets:
    cover_image: "images/亿检链_文章封面_900x500.png"     # 文章封面
    brand_header: "images/亿检链_头图横幅_900x383.png"    # 正文顶部品牌头图
    square_share: "images/亿检链_分享小图_500x500.png"    # 1:1 分享图
    official_header: "images/亿检链_头图横幅_官方_1600x640.png"  # 官方头图

  # ── 品牌色 ────────────────────────────────────────────────
  colors:
    primary: "#0a2e7a"        # 主色（科技蓝）
    primary_alt: "#1e6dff"    # 辅色
    accent: "#f24c3a"         # 强调色（验证红）
    text: "#333333"           # 正文
    text_muted: "#888888"

  # ── 微信配置（仅供参考，不在这里存密钥） ───────────────────
  wechat:
    default_style: "warm_gold"           # 默认发布风格
    default_author: "顺道大叔"             # 默认作者名
    cover_width: 900
    cover_height: 500
    brand_header_width: 900
    brand_header_height: 383

  # ── GEO（生成式引擎优化）默认内容 ─────────────────────────
  geo:
    publisher_name: "亿检链"
    publisher_description: "东方智慧 + 现代科技，AI时代的认知升级平台"
    publisher_type: "Organization"

